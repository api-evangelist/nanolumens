aid: nanolumens
name: NanoLumens
description: 'NanoLumens is an American designer and manufacturer of direct-view LED
  (dvLED) displays and video walls, headquartered in Atlanta, Georgia and founded in
  2006 by Rick Cope. It builds fixed and flexible indoor and outdoor displays in custom
  sizes, shapes and curvatures across the Engage Pro, Engage, NXT, Nixel, NanoPanel 55,
  Captivate, Performance, CLRVision, CLRVU and NanoBanner product lines, together with
  Aurora video processing and the NanoSuite display-management software. Its displays
  are deployed in retail, casinos, higher education, sports and arenas, control rooms,
  hospitality, themed entertainment, government, corporate and transportation
  environments. The software side of the business — the AWARE platform and NanoSuite,
  powered by the ISAAC ecosystem — markets a JSON REST API and webhook-based alerting
  for remote diagnostics, content scheduling and display-fleet monitoring, but that API
  is delivered to display owners through an authenticated tenant and has no public
  developer portal, API reference or machine-readable specification.'
